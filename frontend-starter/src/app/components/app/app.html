<header>
  <a class="brand" routerLink="/recommendations">
    <b>Recommandation Anime</b>
  </a>
  <nav aria-label="Navigation principale">
    <a routerLink="/recommendations">Fil d’actualité</a>
    @if (auth.token()) {
      <a routerLink="/profile">Mon profil</a>
      <div class="account-menu">
        <button
          class="account-menu-trigger"
          type="button"
          (click)="toggleMenu()"
          [attr.aria-expanded]="menuOpen()"
          aria-label="Ouvrir le menu du compte"
        >
          <svg viewBox="0 0 100 100" aria-hidden="true"><use [attr.href]="avatarHref()"></use></svg>
        </button>
        @if (menuOpen()) {
          <div class="account-menu-panel">
            <button type="button" (click)="viewProfile()">Voir mon profil</button>
            <button type="button" (click)="editProfile()">Modifier mes informations</button>
            <button type="button" (click)="logout()">Déconnexion</button>
          </div>
        }
      </div>
    } @else {
      <a routerLink="/login">Connexion</a>
      <a routerLink="/register">Créer un compte</a>
    }
  </nav>
</header>

<main>
  <router-outlet />
</main>
